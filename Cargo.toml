[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
authors = ["Nathan Shea <itzrustz@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/trunkszi/nexora-rs"

[workspace.dependencies]
aws-lc-sys = { version = "~0.46", default-features = false, features = ["ssl"] }
aws-lc-rs = { version = "~1.18", default-features = false, features = ["aws-lc-sys", "alloc"] }
uarch = { git = "https://github.com/trunkszi/uarch-rs.git", branch = "main", default-features = false, features = ["std", "detect"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
nexora-proto = { version = "0.0.1", path = "crates/nexora-proto" }
nexora-macros = { version = "0.0.1", path = "crates/nexora-macros" }
nexora = { path = "crates/nexora" }
liburing = { git = "https://github.com/trunkszi/liburing-rs.git", branch = "main" }
cares = { git = "https://github.com/trunkszi/cares-rs.git", branch = "main" }
thiserror = { version = "2" }
libc = { version = "0.2" }
base64 = { version = "0.22" }
syn = { version = "2", features = ["full", "extra-traits"] }
quote = { version = "1" }
proc-macro2 = { version = "1" }
sonic-rs = { version = "0.5.10", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
clone_on_copy = "deny"
redundant_clone = "deny"
implicit_clone = "deny"
unnecessary_to_owned = "deny"
cloned_instead_of_copied = "deny"
inefficient_to_string = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
expl_impl_clone_on_copy = "deny"
non_canonical_clone_impl = "deny"
useless_conversion = "deny"
useless_asref = "deny"
to_string_in_format_args = "deny"
manual_string_new = "deny"
let_underscore_must_use = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
opt-level = 0
debug = false
strip = "debuginfo"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false

[profile.test]
inherits = "dev"
opt-level = 0
debug = false
strip = "debuginfo"
incremental = false

[profile.release]
panic = "abort"
